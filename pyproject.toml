[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-bigram-model"
version = "1.0.0"
description = "A modular statistical bigram language model built from scratch in Python."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kamal Joshi" }
]
requires-python = ">=3.11"
keywords = [
    "nlp",
    "language-model",
    "bigram",
    "markov-chain",
    "machine-learning",
    "text-generation",
    "education"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
simple-bigram = "main:main"

[project.urls]
Homepage = "https://github.com/thisiskamaljoshi/simple-bigram-model"
Repository = "https://github.com/thisiskamaljoshi/simple-bigram-model"
Issues = "https://github.com/thisiskamaljoshi/simple-bigram-model/issues"

[tool.setuptools]
py-modules = [
    "bigram",
    "config",
    "corpus",
    "detokenizer",
    "download_corpus",
    "evaluator",
    "generator",
    "helpers",
    "main",
    "sampler",
    "sentenceprocessor",
    "serializer",
    "tokenizer",
    "trainer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "dataset/*",
    "models/*",
    "docs/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
